<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cifrado Playfair</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../styles/ciphers.css">
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-lock"></i> Cifrado Playfair</h1>
      <p>Codifica y decodifica digramas usando una matriz generada por clave</p>
    </header>
    <main class="content">
      <div class="card">
        <form id="cipher-form">
          <div class="form-group">
            <label for="input-text">Texto</label>
            <input type="text" id="input-text" placeholder="Escribe tu texto aquí..." required>
          </div>
          <div class="form-group">
            <label for="input-key">Clave:</label>
            <input type="text" id="input-key" pattern="[A-Za-z]+" title="Por favor ingrese solo una palabra con caracteres alfabéticos, sin espacios ni números" placeholder="Escribe tu clave aquí..." required>
          </div>
          <div class="form-group">
            <label for="operation">Operación:</label>
            <select id="operation" required>
              <option value="" selected disabled>Seleccione una opción</option>
              <option value="cipher">Cifrar</option>
              <option value="decipher">Descifrar</option>
            </select>
          </div>
          <button type="submit"><i class="fas fa-key"></i> Procesar</button>
        </form>
      </div>
      <div id="display-ciphered-text" class="hidden">
        <div class="result-container">
          <div class="result-header">
            <h3><i class="fas fa-result"></i> Resultado:</h3>
            <button id="copy-btn">
              <i class="far fa-copy"></i> Copiar
              </button>
          </div>
          <p id="show-ciphered-text"></p>
        </div>  
      </div>
    </main>
    <footer class="footer">
      <p>Cifrado Playfair</p>
    </footer>
  </div>
  <script src="playfair-cipher.js"></script>
</body>
</html>
